<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mental Health Predictor · Daily wellbeing check-ins</title>
    <meta name="description" content="Write a short daily reflection, log sleep, screen time and activity, and see how your wellbeing trends over time. Private by default.">
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07111f" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="Mental Health Predictor">
    <meta property="og:description" content="Daily check-ins, mood trends and personal insights from your journal and habits.">
    <meta property="og:type" content="website">
    <link rel="icon" href="/static/assets/img/favicon.svg?v=__V__" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/assets/css/app.css?v=__V__">
    <script src="/static/assets/js/theme-init.js?v=__V__"></script>
    <script src="/static/assets/vendor/chart.umd.min.js?v=4.5.1" defer></script>
    <script type="module" src="/static/assets/js/app.js?v=__V__"></script>
</head>
<body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="shell">
        <aside class="sidebar" aria-label="Primary">
            <a class="brand" href="#/dashboard" aria-label="Mental Health Predictor home">
                <img class="brand-mark" src="/static/assets/img/favicon.svg?v=__V__" alt="" width="36" height="36">
                <span class="brand-name">Mental Health<span>Predictor</span></span>
            </a>
            <nav class="nav" data-nav></nav>
            <div class="sidebar-foot">
                <a class="btn btn-primary sidebar-cta" href="#/check-in" data-icon-before="plus">New check-in</a>
                <p class="sidebar-note">For self-reflection only. This is not a medical diagnosis. If you are struggling, please reach out to someone you trust or a professional.</p>
                <div data-user-chip></div>
            </div>
        </aside>

        <header class="topbar">
            <a class="brand" href="#/dashboard" aria-label="Mental Health Predictor home">
                <img class="brand-mark" src="/static/assets/img/favicon.svg?v=__V__" alt="" width="32" height="32">
                <span class="brand-name">Mental Health<span>Predictor</span></span>
            </a>
            <div class="topbar-actions">
                <a class="btn btn-primary btn-sm" href="#/check-in" data-icon-before="plus">Check in</a>
                <div data-user-menu></div>
            </div>
        </header>

        <main class="main">
            <div id="view" class="view" tabindex="-1" aria-live="polite"></div>
        </main>

        <nav class="bottom-nav" aria-label="Primary" data-nav-mobile></nav>
    </div>

    <div class="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
    <div id="modal-host"></div>

    <noscript>
        <p style="padding:24px;font-family:sans-serif">This app needs JavaScript enabled to run.</p>
    </noscript>
</body>
</html>
